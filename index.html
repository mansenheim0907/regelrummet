<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Regelrummet</title><meta name="theme-color" content="#172b45">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#172b45;color:#faf7ed;font-family:system-ui,-apple-system,sans-serif;display:flex;justify-content:center}
main{width:min(100%,650px);padding:16px 14px 28px;text-align:center}h1{margin:8px 0 0;font-size:clamp(28px,7vw,42px);letter-spacing:.025em}
p{line-height:1.4;margin:9px 0 14px;color:#d6e1ec}.panel{background:#23405d;border:2px solid #6d93af;border-radius:21px;padding:12px;box-shadow:0 10px 0 #102337}
#board{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));aspect-ratio:9/7;gap:3px;touch-action:none;user-select:none}
.cell{background:#e8dec8;border-radius:6px;min-width:0;display:flex;align-items:center;justify-content:center;color:#23334e;font-weight:900;font-size:clamp(8px,2.3vw,16px)}
.wall{background:repeating-linear-gradient(0deg,#8299a5 0 47%,#6d8593 48% 52%,#8299a5 53%);border:1px solid #526e82}
.passable{opacity:.36}.tile{background:#ffcb69;border:2px solid #ac7433;border-radius:7px;box-shadow:inset 0 -3px #e8a84c;font-size:clamp(8px,2.2vw,15px);padding:0 1px;white-space:nowrap}
.goal{background:#b6ebbd}.player{font-size:clamp(22px,6vw,38px);text-shadow:0 2px 2px #fff}
.controls{margin:16px auto 8px;display:grid;grid-template-columns:repeat(3,68px);gap:8px;justify-content:center;touch-action:manipulation}
button{border:2px solid #f4e9ce;background:#ffd57b;color:#183049;border-radius:15px;font:900 26px system-ui;min-height:58px;box-shadow:0 4px 0 #946c38;cursor:pointer}button:active{transform:translateY(3px);box-shadow:0 1px 0 #946c38}.spacer{visibility:hidden}
#reset{font-size:16px;min-height:42px;padding:8px 22px;margin-top:7px}#status{min-height:24px;font-weight:700;color:#fff2ad}
small{display:block;color:#bad1e6;margin-top:12px}
</style></head><body><main><h1>🧩 Regelrummet</h1><p>Flytta orden för att ändra reglerna. <strong>VÄGG ÄR STOPP</strong> gör muren ogenomtränglig. Kan du bryta regeln och nå flaggan?</p>
<div class="panel"><div id="board" aria-label="Spelplan med nio kolumner och sju rader"></div></div>
<div id="status" role="status" aria-live="polite">Skjut på ordbrickan STOPP för att bryta regeln.</div>
<div class="controls" aria-label="Styrning"><span class="spacer"></span><button data-dir="up" aria-label="Uppåt">↑</button><span class="spacer"></span><button data-dir="left" aria-label="Vänster">←</button><button data-dir="down" aria-label="Nedåt">↓</button><button data-dir="right" aria-label="Höger">→</button></div>
<button id="reset">↻ Börja om</button><small>Mobil: använd pilarna eller svep på spelplanen. Dator: piltangenter eller WASD.</small>
<script>
(()=>{'use strict';
const W=9,H=7,board=document.getElementById('board'),status=document.getElementById('status');
const initialTiles=[{x:1,y:1,text:'VÄGG'},{x:2,y:1,text:'ÄR'},{x:3,y:1,text:'STOPP'}];
let player,tiles,won=false;
const key=(x,y)=>x+','+y;
const walls=new Set([2,3,4,5].map(y=>key(4,y)));
const goal={x:7,y:4};
function reset(){player={x:2,y:4};tiles=initialTiles.map(t=>({...t}));won=false;status.textContent='Skjut på ordbrickan STOPP för att bryta regeln.';render()}
function tileAt(x,y){return tiles.find(t=>t.x===x&&t.y===y)}
function blockingWall(){return tiles.some(t=>t.text==='VÄGG'&&tiles.some(a=>a.text==='ÄR'&&a.x===t.x+1&&a.y===t.y&&tiles.some(b=>b.text==='STOPP'&&b.x===t.x+2&&b.y===t.y)))}
function inBounds(x,y){return x>=0&&x<W&&y>=0&&y<H}
function move(dx,dy){if(won)return;const x=player.x+dx,y=player.y+dy;if(!inBounds(x,y))return;
 const tile=tileAt(x,y);
 if(tile){const nx=x+dx,ny=y+dy;if(!inBounds(nx,ny)||tileAt(nx,ny)||walls.has(key(nx,ny))&&blockingWall())return;tile.x=nx;tile.y=ny}
 else if(walls.has(key(x,y))&&blockingWall())return;
 player={x,y};if(x===goal.x&&y===goal.y){won=true;status.textContent='🎉 Du klarade Regelrummet! Bra jobbat.'}else{status.textContent=blockingWall()?'VÄGG ÄR STOPP – muren blockerar dig.':'Regeln är bruten! Nu går det att passera muren.'}render()}
function render(){board.replaceChildren();const stop=blockingWall();for(let y=0;y<H;y++)for(let x=0;x<W;x++){const cell=document.createElement('div');cell.className='cell';if(walls.has(key(x,y)))cell.classList.add('wall',...(stop?[]:['passable']));if(x===goal.x&&y===goal.y){cell.classList.add('goal');cell.textContent='🏁'}
 const t=tileAt(x,y);if(t){cell.className='cell tile';cell.textContent=t.text}
 if(player.x===x&&player.y===y){cell.className='cell player';cell.textContent='🧍'}
 board.appendChild(cell)}}
const dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>move(...dirs[b.dataset.dir])));
document.addEventListener('keydown',e=>{const d={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'}[e.key];if(d){e.preventDefault();move(...dirs[d])}});
let touch=null;board.addEventListener('touchstart',e=>{const t=e.changedTouches[0];touch={x:t.clientX,y:t.clientY}},{passive:true});
board.addEventListener('touchend',e=>{if(!touch)return;const t=e.changedTouches[0],dx=t.clientX-touch.x,dy=t.clientY-touch.y;touch=null;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;move(...(Math.abs(dx)>Math.abs(dy)?dirs[dx>0?'right':'left']:dirs[dy>0?'down':'up']))},{passive:true});
document.getElementById('reset').addEventListener('click',reset);reset();
})();
</script></main></body></html>
